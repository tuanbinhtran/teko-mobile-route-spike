name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: PawTrackRoute # must match "expo.name" in app.json (Xcode scheme/target name)
  CI: '1'

jobs:
  build:
    # Expo SDK 58 needs Xcode >= 26.4; the macos-26 image defaults to a newer 26.x.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version
          node --version

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Release (iphoneos, unsigned)
        run: |
          xcodebuild \
            -workspace "ios/${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { tail -n 200 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log
          test -d "build/Build/Products/Release-iphoneos/${APP_NAME}.app"

      - name: Check embedded JS bundle and background mode
        run: |
          APP="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          ls -la "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${APP_NAME}.app" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
